[package]
name = "heatsync-chat"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "heatsync multichat as a native app"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
parley = "0.12"
swash = "0.2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
