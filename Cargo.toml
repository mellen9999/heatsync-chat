[package]
name = "heatsync-chat"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "twitch, kick and youtube chat in one native window, with heatsync emotes"
repository = "https://github.com/mellen9999/heatsync-chat"
homepage = "https://heatsync.org"
readme = "README.md"
keywords = ["twitch", "kick", "youtube", "chat", "emotes"]
categories = ["gui"]

[dependencies]
winit = "0.30"
softbuffer = "0.4"
parley = "0.12"
swash = "0.2"
icu_segmenter = { version = "2", default-features = false, features = ["compiled_data"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "perf-dfa", "perf-onepass"] }
image-webp = "0.2"
gif = "0.14"
png = "0.18"
# already built for the window frame; draws the flat svg badges (bttv) the other decoders cannot
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

# the aarch64 build is cross-linked by zig, which has no fontconfig to link against: that one finds
# libfontconfig when the app starts (no fonts, not a crash, where it's missing). x86_64 is untouched
[target.'cfg(target_arch = "aarch64")'.dependencies]
fontique = { version = "0.12", default-features = false, features = ["fontconfig-dlopen"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
